<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Github Login</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="container w-25 mt-5">
      <div class="">
        <div class="">
          <div class="text-center mt-5">
            <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="github-logo" width="50" height="50" />
            <h4 class="mt-3 mb-4">Sign in to GitHub</h4>
          </div>
          <div class="border p-3">
            <div class="mb-3">
              <label for="username" class="form-label">
                Username or email address
              </label>
              <input type="text" class="form-control" id="username" />
            </div>
            <div class="mb-3">
              <div class="d-flex justify-content-between">
                <label for="password" class="form-label"> Password </label>
                <a href="#"> Forgot password? </a>
              </div>
              <input type="password" class="form-control" id="password" />
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-success">Sign in</button>
            </div>
          </div>
          <div class="border p-3 mt-3 text-center">
            <span>New to GitHub?</span>
            <a href="#"> Create an account. </a>
          </div>
          <div class="text-center mt-5">
            <span class="mx-2">Terms</span>
            <span class="mx-2">Privacy</span>
            <span class="mx-2">Security</span>
            <span class="mx-2">Contact</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
