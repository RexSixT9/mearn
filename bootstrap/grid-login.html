<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <h1 class="text-center text-primary">Grid Login Form</h1>
    <div class="row border border-3 p-3 m-3 rounded">
      <div class="col-6">
        <img
          src="https://st2.depositphotos.com/1001599/43046/v/450/depositphotos_430460192-stock-illustration-sign-page-abstract-concept-vector.jpg"
          alt="logo"
          width="500px"
          height="500px"
        />
      </div>
      <div class="col-6">
        <h2 class="text-center text-primary my-5">Login</h2>
        <input type="text" placeholder="Username" class="form-control my-4" />
        <input
          type="password"
          placeholder="Password"
          class="form-control my-4"
        />
        <button class="btn btn-primary w-100">Login</button>
      </div>
    </div>
  </body>
</html>
