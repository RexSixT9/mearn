<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
    <style>
      body {
        background: url(https://img.magnific.com/free-photo/top-view-desk-concept-with-notepad_23-2148604955.jpg?t=st=1791978070~exp=1791981670~hmac=ddab252243cbeffdbdd88626e818dfc8c464fd5ba962b2e8fce06c32cf65ebf9&w=1480);
        background-size: cover;
        background-position: center;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      input {
        height: 60px;
        text-align: right;
        font-size: 25px;
      }
    </style>
  </head>
  <body>
    <div class="card p-3" style="max-width: 350px">
      <h3 class="text-center mb-3">Calculator</h3>
      <input
        id="result"
        type="text"
        class="form-control mb-3"
      />
      <div class="row g-2">
        <div class="col-3">
          <button class="btn w-100" onclick="clearBox()">AC</button>
        </div>
        <div class="col-3">
          <button class="btn w-100" onclick="removeLastItem()">DEL</button>
        </div>
        <div class="col-3">
          <button class="btn w-100" onclick="displayNumber('%')">%</button>
        </div>
        <div class="col-3">
          <button class="btn w-100" onclick="displayNumber('/')">/</button>
        </div>

        <div class="col-3">
          <button class="btn w-100" onclick="displayNumber(7)">7</button>
        </div>
        <div class="col-3">
          <button class="btn w-100" onclick="displayNumber(8)">8</button>
        </div>
        <div class="col-3">
          <button class="btn w-100" onclick="displayNumber(9)">9</button>
        </div>
        <div class="col-3">
          <button class="btn w-100" onclick="displayNumber('*')">*</button>
        </div>

        <div class="col-3">
          <button class="btn w-100" onclick="displayNumber(4)">4</button>
        </div>
        <div class="col-3">
          <button  class="btn w-100" onclick="displayNumber(5)">5</button>
        </div>
        <div class="col-3">
          <button  class="btn w-100" onclick="displayNumber(6)">6</button>
        </div>
        <div class="col-3">
          <button  class="btn w-100" onclick="displayNumber('-')">&#8722;</button>
        </div>

        <div class="col-3">
          <button" class="btn w-100" onclick="displayNumber(1)">1</button>
        </div>
        <div class="col-3">
          <button class="btn w-100" onclick="displayNumber(2)">2</button>
        </div>
        <div class="col-3">
          <button class="btn w-100" onclick="displayNumber(3)">3</button>
        </div>
        <div class="col-3">
          <button class="btn w-100" onclick="displayNumber('+')">&#43;</button>
        </div>

        <div class="col-9">
          <button class="btn w-100" onclick="displayNumber(0)">0</button>
        </div>
        <div class="col-3">
          <button  class="btn w-100" onclick="evalExpression()">
            =
          </button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
