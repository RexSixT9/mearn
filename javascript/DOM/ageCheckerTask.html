<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Checker</title>
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-info">
    <div class="card mx-auto mt-5 bg-white" style="max-width: 400px">
      <div class="card-body text-center">
        <h1 class="card-title mb-4">Age Checker</h1>
        <input
          type="number"
          id="age-value"
          class="form-control mb-3"
          placeholder="Enter your age"
        />
        <button onclick="checkAge()" class="btn btn-primary mx-auto">
          Check
        </button>
        <p id="result" class="mt-3"></p>
      </div>
      <!-- </div> -->
    </div>

    <script>
      function checkAge() {
        const age = document.getElementById("age-value").value;
        const res = document.getElementById("result");
        if (age > 0 && age < 150) {
          if (age >= 18) {
              res.textContent = "You are eligible to vote";
              res.style.color = "green";
          } else {
            res.style.color = "red";
            res.textContent = "You are not eligible to vote";
          }
        } else {
          res.textContent = "Age must be a positive number between 1 and 149";
        }
      }
    </script>
  </body>
</html>
