<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt</title>
</head>
<body>

    <script>

        var country = prompt("Enter your country name: ");
        if (country == "" || country.length == 0) {
            alert("Please enter your country name.");
        } else {
            alert("Your country is: " + country);
        }

    </script>


    
</body>
</html>
