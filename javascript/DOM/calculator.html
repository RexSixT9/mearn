<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-primary">
    <div class="mt-5 mx-auto">
      <h2 class="text-center">Calculator</h2>
      <div class="card mx-auto mt-3 bg-white" style="max-width: 400px">
        <div class="card-body text-center">
          <input type="text" class="form-control mb-2" id="input" />
          <button class="btn btn-info">1</button>
          <button class="btn btn-info">2</button>
          <button class="btn btn-info">3</button><br><br>
          <button class="btn btn-info">4</button>
          <button class="btn btn-info">5</button>
          <button class="btn btn-info">6</button><br><br>
          <button class="btn btn-info">7</button>
          <button class="btn btn-info">8</button>
          <button class="btn btn-info">9</button><br><br>
          <button class="btn btn-info">0</button>
        </div>
      </div>
    </div>
  </body>
</html>
