<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fetch Task</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="container mx-auto flex flex-col items-center p-4">
      <div class="w-full max-w-sm">
        <h1 class="text-center text-xl font-semibold">User Details</h1>
        <div id="card-container" class="mt-6"></div>
      </div>
      <button
        onclick="displayCard()"
        class="mt-6 rounded bg-black px-4 py-2 text-white"
      >
        Fetch User
      </button>
    </div>
    <script>
      async function fetchData() {
        try {
          let num = Math.floor(Math.random() * 30) + 1;
          console.log(num);
          const response = await fetch(`https://dummyjson.com/users/${num}`);
          const data = await response.json();
          console.log(data);
          return data;
        } catch (err) {
          console.log(err);
          throw err;
        }
      }

      async function displayCard() {
        let data = await fetchData();
        console.log(data);
        let cardContainer = document.getElementById("card-container");
        let card = `
        <div class="flex flex-col items-center gap-4 rounded border border-gray-200 p-5 text-center">
          <img class="h-30 w-30" src="${data.image}" alt="${data.firstName} ${data.lastName}">
          <div>
            <div class="mb-2 text-xl font-semibold">${data.firstName} ${data.lastName}</div>
            <p>Age: ${data.age}</p>
            <p>Gender: ${data.gender}</p>
            <p>Address: ${data.address.address}</p>
            <p>Email: ${data.email}</p>
            <p>Phone: ${data.phone}</p>      
          </div>
        </div>
              `;
        cardContainer.innerHTML = card;
      }
    </script>
  </body>
</html>
