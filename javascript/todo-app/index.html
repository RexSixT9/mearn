<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-white">
    <main class="flex justify-center px-4 py-12">
      <div class="w-full max-w-md">
        <h1 class="text-2xl font-semibold text-center">Todo App</h1>
        <form class="mt-8 items-center mx-auto">
          <div class="flex items-center space-x-3 h-full">
            <input
              id="taskInput"
              type="text"
              placeholder="Enter task"
              class="w-4/5 w-full rounded-md border border-slate-300 px-3 py-2.5 text-sm"
            />
            <button
              type="button"
              onclick="addTask()"
              class="w-1/5 rounded-md bg-blue-500 px-4 py-2.5 text-sm font-semibold text-white"
            >
              Add
            </button>
          </div>
        </form>
        <ul id="taskList" class="mt-6 space-y-2"></ul>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
