<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-gray-50 text-black">
    <div class="flex min-h-screen items-center justify-center px-4">
      <div
        class="w-full max-w-sm space-y-4 rounded-lg border border-blue-100 bg-white p-6"
      >
        <h2 class="text-center text-2xl font-bold">Login</h2>
        <form action="">
          <label for="uname" class="block font-semibold">Username</label>
          <input
            id="uname"
            type="text"
            placeholder="Username"
            autoComplete="username"
            class="w-full rounded border border-blue-200 p-2.5 outline-none focus:border-blue-500"
          />
          <label for="passwd" class="block font-semibold">Password</label>
          <input
            id="passwd"
            type="password"
            placeholder="Password"
            autoComplete="current-password"
            class="w-full rounded border border-blue-200 p-2.5 outline-none focus:border-blue-500"
          />
          <button
            onclick="login()"
            type="submit"
            class="w-full rounded bg-blue-600 p-2.5 font-medium text-white hover:bg-blue-700"
          >
            Login
          </button>
        </form>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
