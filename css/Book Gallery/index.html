<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,500&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="shortcut icon"
      href="https://cdn-icons-png.flaticon.com/512/8832/8832880.png"
      type="image/x-icon"
    />
  </head>

  <body>
    <!-- Header -->
    <header>
      <div id="head">
        <h2 class="logo">Book Gallery</h2>
        <input type="text" placeholder="Search Books" />
      </div>
    </header>

    <!-- Banner -->
    <video src="./video.mp4" autoplay loop muted></video>

    <!-- Content -->
    <section>
      <h2 style="align-items: center">Books</h2>
      <div class="row">
        <div class="column">
          <img
            src="https://images1.penguinrandomhouse.com/cover/9780593081259"
            alt="book-1"
          />
          <h4>Book 1</h4>
          <p>Price: <span>999</span></p>
          <button>Read More</button>
        </div>
        <div class="column">
          <img
            src="https://images1.penguinrandomhouse.com/cover/9780593548066"
            alt="book-1"
          />
          <h4>Book 2</h4>
          <p>Price: <span>899</span></p>
          <button>Read More</button>
        </div>
        <div class="column">
          <img
            src="https://images2.penguinrandomhouse.com/cover/9780593310854"
            alt="book-1"
          />
          <h4>Book 3</h4>
          <p>Price: <span>799</span></p>
          <button>Read More</button>
        </div>
        <div class="column">
          <img
            src="https://images4.penguinrandomhouse.com/cover/9780593491973"
            alt="book-1"
          />
          <h4>Book 4</h4>
          <p>Price: <span>599</span></p>
          <button>Read More</button>
        </div>
        <div class="column">
          <img
            src="https://images2.penguinrandomhouse.com/cover/9780593241608"
            alt="book-1"
          />
          <h4>Book 5</h4>
          <p>Price: <span>699</span></p>
          <button>Read More</button>
        </div>
      </div>
    </section>

    <!-- Footer -->

    <footer>
      <h2>Book Gallery</h2>
      <div class="footer">
        <div>
          <p>Contact:</p>
          <p>Email: <a href="">bookgallery@gmail.com</a></p>
          <p>Website: <a href="">www.bookgallery.com</a></p>
        </div>
        <div>
          <p>Follow us on:</p>
          <p>Facebook</p>
          <p>Twitter</p>
          <p>Instagram</p>
        </div>
      </div>
    </footer>
  </body>
</html>
