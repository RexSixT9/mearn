<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IFrames</title>
  </head>
  <body>
    <h3>IFrame</h3>

    <!-- Local Webpage -->
    <iframe
      src="../images/image.html"
      frameborder="1"
      width="50%"
      height="500px"
    ></iframe>

    <!-- From Browser -->
    <iframe
      src="https://www.microsoft.com"
      frameborder="1"
      width="50%"
      height="500px"
    ></iframe>

    <!-- Video From Youtube -->
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/87uSIcSLymQ?si=shatiQIW7Mi5P9j0"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>

    <!-- Google Maps -->
     <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d60170.40528003936!2d76.30053269870257!3d9.975826708144545!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3b0873b485cfd4cd%3A0xfe9b9b8a7510791!2sNew%20Central%20Talkies%204K%20Dolby%20Atmos!5e1!3m2!1sen!2sin!4v1786964598407!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </body>
</html>
