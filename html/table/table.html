<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
  </head>
  <body>
    <h3>Table Example</h3>

    <table width="450px" border="1px">
      <thead bgColor="lightblue">
        <tr>
          <th>No.</th>
          <th>Name</th>
          <th colspan="2">Courses</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Arun</td>
          <td>Data Science</td>
          <td>Software Testing</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Gopan</td>
          <td>Data Analysis</td>
          <td>Software Testing</td>
        </tr>
        <tr>
          <td>3</td>
          <td>Vimal</td>
          <td>Software Testing</td>
          <td>Data Analysis</td>
        </tr>
      </tbody>
    </table>

    <br><br>

    <table border="2px" width="200px">
      <tr>
        <th rowspan="2">Phone</th>
        <td>1234567890</td>
      </tr>
      <tr>
        <td>9876543210</td>
      </tr>
    </table>


  </body>
</html>
