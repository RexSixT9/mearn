<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
  </head>
  <body>
    <h2>Forms</h2>

    <form>
      <label for="uname">Username:</label>
      <input type="text" id="uname" placeholder="Enter your username" />

      <br /><br />
      <label for="passwd">Password:</label>
      <input type="password" id="passwd" placeholder="********" />

      <br /><br />
      <label for="email">Email:</label>
      <input type="email" id="email" placeholder="user@example.com" />

      <br /><br />
      <label for="phone">Phone:</label>
      <input type="text" id="phone" placeholder="+91 9876543210" />

      <br /><br />
      <label for="age">Age:</label>
      <input type="number" id="age" placeholder="21" />

      <br /><br />
      <label for="dob">DOB:</label>
      <input type="date" id="dob" />

      <br /><br />
      <label for="address">Address:</label>
      <textarea
        id="address"
        rows="5"
        placeholder="Enter your Address"
      ></textarea>

      <br /><br />
      <label>Gender:</label>
      <input type="radio" name="gender" id="male" />
      <label for="male">Male</label>
      <input type="radio" name="gender" id="female" />
      <label for="female">Female</label>
      <input type="radio" name="gender" id="others" />
      <label for="others">Others</label>

      <br /><br />
      <label for="skills">Skills:</label>
      <input type="checkbox" id="skill-react" />
      <label for="skill-react">React</label>
      <input type="checkbox" id="skill-angular" />
      <label for="skill-angular">Angular</label>
      <input type="checkbox" id="skill-next" />
      <label for="skill-next">Next</label>
      <input type="checkbox" id="skill-python" />
      <label for="skill-python">Python</label>

      <br /><br />
      <label for="locations">Locations:</label>
      <select id="locations">
        <option value="" hidden selected>Choose your location</option>
        <option value="">Kochi</option>
        <option value="">Calicut</option>
        <option value="">Thrissur</option>
      </select>

      <br /><br />
      <label for="resume">Resume:</label>
      <input type="file" id="resume" />

      <br /><br />
      <input type="submit" />
      <input type="reset" />
    </form>
  </body>
</html>
